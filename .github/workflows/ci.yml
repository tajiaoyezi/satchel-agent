name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: gofmt / vet / build / test
    runs-on: ubuntu-latest
    # 主控仓库的 pkg/（securechan、xrpc）经 go.mod 的 replace 引用同级目录：两个仓库检出成 satchel-agent/ 与 satchel/，
    # satchel 钉在 .satchel-ref 写的提交上（m2-02 design 第 1 条）。
    defaults:
      run:
        working-directory: satchel-agent
    steps:
      - uses: actions/checkout@v7
        with:
          path: satchel-agent

      - name: read pinned satchel commit
        run: echo "SATCHEL_REF=$(tr -d '[:space:]' < .satchel-ref)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          repository: tajiaoyezi/satchel
          ref: ${{ env.SATCHEL_REF }}
          path: satchel

      - uses: actions/setup-go@v7
        with:
          go-version-file: satchel-agent/go.mod
          cache-dependency-path: satchel-agent/go.sum

      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "以下文件未经 gofmt：" && echo "$files"
            exit 1
          fi

      - name: go vet
        run: go vet -tags with_quic ./...

      - name: go build
        run: go build -tags with_quic ./...

      - name: go test
        run: go test -tags with_quic ./...

  # 内核五项证伪测试的完整版（m2-01，README「内核的编译标签」）：时间窗 30 秒、数据量按 MB 足量，本机跑一次约七分钟，
  # 所以只在推送到 main 与手动触发时跑；是单独的 job，不挡上面的 check。
  falsification:
    name: kernel falsification (full)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # 主控仓库的 pkg/（securechan、xrpc）经 go.mod 的 replace 引用同级目录：两个仓库检出成 satchel-agent/ 与 satchel/，
    # satchel 钉在 .satchel-ref 写的提交上（m2-02 design 第 1 条）。
    defaults:
      run:
        working-directory: satchel-agent
    steps:
      - uses: actions/checkout@v7
        with:
          path: satchel-agent

      - name: read pinned satchel commit
        run: echo "SATCHEL_REF=$(tr -d '[:space:]' < .satchel-ref)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          repository: tajiaoyezi/satchel
          ref: ${{ env.SATCHEL_REF }}
          path: satchel

      - uses: actions/setup-go@v7
        with:
          go-version-file: satchel-agent/go.mod
          cache-dependency-path: satchel-agent/go.sum

      - name: go test (falsification)
        run: go test -tags with_quic,falsification -run Falsification -timeout 30m -v ./...
